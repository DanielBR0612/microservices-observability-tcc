spring.datasource.url=jdbc:postgresql://localhost:5432/banco_dsd

spring.datasource.username=postgres

spring.datasource.password=postgres

spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

otel.service.name=banco-soap
otel.metrics.exporter=none
otel.logs.exporter=none
otel.traces.exporter=otlp 
otel.exporter.otlp.endpoint=http://jaeger:4318

logging.level.com.example.BancoCoreSoap.service.NotificationService=INFO
