spring.datasource.url=jdbc:postgresql://localhost:5433/banco_dsd

spring.datasource.username=postgres

spring.datasource.password=postgres

spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

otel.service.name=banco-soap
otel.metrics.exporter=none
otel.logs.exporter=none
otel.traces.exporter=otlp 
otel.exporter.otlp.endpoint=http://localhost:4318

logging.level.com.example.BancoCoreSoap.service.NotificationService=INFO

# 1. Exibir logs de requisições e payloads SOAP (Spring WS)
logging.level.org.springframework.ws=DEBUG
logging.level.org.springframework.ws.server.MessageTracing=TRACE
logging.level.org.springframework.ws.client.MessageTracing=TRACE

logging.level.root=INFO
logging.level.com.example=DEBUG

# 3. Formatação explícita do Console (evita supressão por agentes como OpenTelemetry)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
