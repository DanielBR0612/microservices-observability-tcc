version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db_sistema
    restart: always
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres  
      POSTGRES_DB: banco_dsd     
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  ws-service:
    build: ./ws-service
    container_name: container_ws
    volumes:
      - ./ws-service:/app
      - /app/node_modules
    command: npx ts-node-dev --respawn server.ts
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - RABBITMQ_URL=amqp://rabbitmq:5672
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: projeto-dsd-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  atm-monitor:
    build: ./ATMService
    container_name: atm-monitor
    command: npx ts-node-dev --respawn monitor-server.ts
    volumes:
      - ./ATMService:/app
      - /app/node_modules
    ports:
      - "6000:6000/udp" # UDP (Status Heartbeat)
      - "6001:6001"     # TCP (ATM Comandos)
      - "6002:6002"     # TCP (Gateway Interface)
    networks:
      - app-network
    restart: always

  atm-cluster:
    build: ./ATMService
    container_name: atm-cluster
    command: npx ts-node-dev --respawn atm-cluster.ts
    volumes:
      - ./ATMService:/app
      - /app/node_modules
    environment:
      - MONITOR_HOST=atm-monitor 
    depends_on:
      - atm-monitor
    networks:
      - app-network
    restart: on-failure

  gateway:
    build: ./BancoApiGateway
    container_name: container_gateway
    volumes:
      - ./BancoApiGateway:/app
      - /app/node_modules
    command: npx ts-node-dev --respawn index.ts
    depends_on:
      - core-soap
      - rest-api
      - ws-service
      - rabbitmq
      - comprovantes-service
      - atm-monitor
    ports:
      - "8000:3000"
    environment:
      - SOAP_URL=http://core-soap:8080
      - REST_URL=http://rest-api:8081
      - WS_URL=ws://ws-service:3000
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - GRPC_COMPROVANTES_URL=comprovantes-service:50051
      - PORT=3000
      - MONITOR_HOST=atm-monitor
    networks:
      - app-network

  comprovantes-service:
    build: ./ComprovantesService
    container_name: container_comprovantes
    volumes:
      - ./ComprovantesService:/app
      - /app/node_modules
    command: npx ts-node-dev --respawn grpc-server.ts
    ports:
      - "50051:50051"
    networks:
      - app-network
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" 
      - "4317:4317"   
      - "4318:4318"   
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - app-network

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge