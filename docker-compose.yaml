services:
  db:
    image: postgres:15-alpine
    container_name: db_sistema
    restart: always
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres  
      POSTGRES_DB: banco_dsd     
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

    ws-service:
      build: ./ws-service
      container_name: container_ws
      volumes:
        - ./ws-service:/app
        - /app/node_modules
      command: sh -c "npm install && NODE_OPTIONS='--require @opentelemetry/auto-instrumentations-node/register' npm run start"
      ports:
        - "8083:8083"
      depends_on:
        - rabbitmq
        - jaeger
      environment:
        - PORT=8083
        - RABBITMQ_URL=amqp://rabbitmq:5672
        - WS_JWT_SECRET=segredo-de-teste-123
        - OTEL_SERVICE_NAME=ws-service
        - OTEL_TRACES_EXPORTER=otlp
        - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
        - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
        - OTEL_METRICS_EXPORTER=none
        - OTEL_LOGS_EXPORTER=none
      networks:
        - app-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: projeto-dsd-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  atm-monitor:
    build: ./ATMService
    container_name: atm-monitor
    environment: 
      - OTEL_SERVICE_NAME=atm-monitor 
    command: npx ts-node-dev --respawn monitor-server.ts
    volumes:
      - ./ATMService:/app
      - /app/node_modules
    ports:
      - "6000:6000/udp" # UDP (Status Heartbeat)
      - "6001:6001"     # TCP (ATM Comandos)
      - "6002:6002"     # TCP (Gateway Interface)
    networks:
      - app-network
    restart: always

  atm-cluster:
    build: ./ATMService
    container_name: atm-cluster
    command: sh -c "npm install && npm run cluster"
    volumes:
      - ./ATMService:/app
      - /app/node_modules
    environment:
      - MONITOR_HOST=atm-monitor 
      - OTEL_SERVICE_NAME=atm-cluster
    depends_on:
      - atm-monitor
    networks:
      - app-network
    restart: on-failure

  gateway:
    build: ./BancoApiGateway
    container_name: container_gateway
    volumes:
      - ./BancoApiGateway/api-gateway:/usr/src/app/api-gateway
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      - ws-service
      - rabbitmq
      - comprovantes-service
      - atm-monitor
    ports:
      - "8000:3000"
    environment:
      - REST_URL=http://host.docker.internal:8081
      - SOAP_URL=http://host.docker.internal:8080
      - WS_URL=ws://ws-service:3000
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - GRPC_COMPROVANTES_URL=comprovantes-service:50051
      - PORT=3000
      - MONITOR_HOST=atm-monitor
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    networks:
      - app-network

  comprovantes-service:
    build: ./ComprovantesService
    container_name: container_comprovantes
    command: sh -c "pip install -r requirements.txt && python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. comprovante.proto && python server.py"
    volumes:
      - ./ComprovantesService:/app
      - /app/node_modules
    ports:
      - "50051:50051"
    networks:
      - app-network
  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686" 
      - "4317:4317"   
      - "4318:4318"   
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - OTEL_SERVICE_NAME=comprovantes-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    networks:
      - app-network
  
  k6:
    image: grafana/k6:latest
    container_name: k6-load-test
    networks:
      - app-network
    volumes:
      - ./script.js:/scripts/script.js
      - ./ComprovantesService/comprovante.proto:/scripts/comprovante.proto
    command: run /scripts/script.js
    depends_on:
      - gateway
      - comprovantes-service

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge
  
