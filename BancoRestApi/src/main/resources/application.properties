spring.datasource.url=jdbc:postgresql://localhost:5433/banco_dsd
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

server.port=8081

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

spring.application.name=rest-api
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

logging.level.org.example.bancorestapi.service.NotificationService=INFO

# Logs de requisicoes HTTP: mostra qual handler atendeu (ou "No mapping for")
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
spring.mvc.log-request-details=true

# SQL executado e valores dos parametros (Hibernate 6 / Spring Boot 3)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Mostra em qual banco o servico esta conectado
logging.level.com.zaxxer.hikari=DEBUG

# Logs do seu codigo
logging.level.org.example.bancorestapi=DEBUG

server.error.include-message=always
server.error.include-binding-errors=always